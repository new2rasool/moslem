[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "group-manager-bot"
version = "0.1.0"
description = "Telegram Group Manager Bot — professional group management (FA/EN)"
requires-python = ">=3.10"
# هستهٔ اسکلت بدون وابستگی خارجی اجرا می‌شود (stdlib: sqlite3/json/asyncio).
# وابستگی‌های اجرایی واقعی (Pyrogram و…) به‌صورت اختیاری (extras) تعریف شده‌اند.
dependencies = []

[project.optional-dependencies]
run = [
    "Pyrogram>=2.0.106",
    "TgCrypto>=1.2.5",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.9",
]

[tool.setuptools]
packages = ["bot", "bot.i18n", "bot.domain", "bot.services", "bot.repositories", "bot.db", "bot.cache", "bot.handlers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
